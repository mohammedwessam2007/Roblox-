name: Studio CLI local-place probe (no Roblox login/key)
on:
  push:
    branches:
      - qa/studio-cli-local-probe-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-cli:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install hash-pinned Rojo and build test place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'build','reports','tools_bin' | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'rojo.zip'
          Invoke-WebRequest 'https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-windows-x86_64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'E1C9A78193C609720F3AFB38057D3909ED483ECBF5E9E3541313BA0DCBC4F1F8') { throw 'Rojo SHA mismatch' }
          Expand-Archive $zip -DestinationPath 'tools_bin'
          $rojo = Get-ChildItem 'tools_bin' -Recurse -Filter 'rojo.exe' | Select-Object -First 1
          if (!$rojo) { throw 'rojo.exe missing' }
          & $rojo.FullName build 'test.project.json' -o 'build/StealRealityTest.rbxl'
          if ($LASTEXITCODE -ne 0) { throw 'Rojo build failed' }
          Write-Host ('LOCAL_PLACE_SHA256=' + (Get-FileHash 'build/StealRealityTest.rbxl').Hash)
      - name: Install official Roblox Studio and attempt documented local CLI smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'reports/STUDIO_CLI_OFFLINE_RESULT.txt'
          'STATE=NOT_RUN' | Set-Content $report
          $installer = Join-Path $env:RUNNER_TEMP 'RobloxStudioInstaller.exe'
          Invoke-WebRequest 'https://setup.rbxcdn.com/RobloxStudioInstaller.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Roblox') { throw 'Official installer signature invalid' }
          $installerProcess = Start-Process -FilePath $installer -PassThru
          $studio = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            $studio = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox/Versions') -Recurse -Filter 'RobloxStudioBeta.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($studio) { break }
          }
          if (!$studio) {
            'STATE=BLOCKED_INSTALL_OR_NETWORK' | Set-Content $report
            throw 'Studio executable not installed within 180 sec'
          }
          $place = (Resolve-Path 'build/StealRealityTest.rbxl').Path
          $script = (Resolve-Path 'tools/studio/cli_offline_smoke.luau').Path
          $out = Join-Path (Get-Location).Path 'reports/STUDIO_CLI_OUTPUT.txt'
          Write-Host 'Launching OFFICIAL --task RunScript against local RBXL. No credential supplied.'
          $p = Start-Process -FilePath $studio.FullName -ArgumentList @('--task','RunScript','--localPlaceFile',('"' + $place + '"'),'--runScriptFile',('"' + $script + '"'),'--outputFile',('"' + $out + '"'),'--quitAfterExecution') -PassThru
          if (!$p.WaitForExit(160000)) {
            $p | Stop-Process -Force -ErrorAction SilentlyContinue
            'STATE=BLOCKED_AUTH_OR_GUI_TIMEOUT' | Set-Content $report
            throw 'Studio CLI did not exit in 160 sec (possibly login/GUI blocked)'
          }
          Start-Sleep -Seconds 2
          if (!(Test-Path $out)) {
            'STATE=BLOCKED_NO_ENGINE_OUTPUT' | Set-Content $report
            throw 'Studio did not create output file'
          }
          $data = Get-Content $out -Raw
          if ($data -match 'OFFLINE_STUDIO_SMOKE: 3 passed, 0 failed') {
            'STATE=PASS_OFFLINE_ENGINE_SMOKE_ONLY' | Set-Content $report
            Write-Host 'OFFLINE_STUDIO_SMOKE verified in real Roblox Studio CLI (not Play mode).'
          } else {
            'STATE=FAIL_OR_UNVERIFIED_ENGINE_OUTPUT' | Set-Content $report
            Write-Host $data
            throw 'No real Studio engine smoke PASS marker; do not claim success'
          }
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-cli-local-place-evidence
          if-no-files-found: warn
          path: |
            reports/STUDIO_CLI_*.txt
            build/StealRealityTest.rbxl
