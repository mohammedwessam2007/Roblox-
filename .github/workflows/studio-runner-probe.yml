name: Studio runner feasibility
on:
  push:
    branches: [qa/studio-windows-runner-probe]
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Verify private desktop components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'devtunnel.exe'
          $msi = Join-Path $env:RUNNER_TEMP 'tightvnc.msi'
          Invoke-WebRequest -Uri 'https://aka.ms/TunnelsCliDownload/win-x64' -OutFile $cli
          $s = Get-AuthenticodeSignature $cli
          Write-Host ("DevTunnelSignature=" + $s.Status)
          Write-Host ("DevTunnelSigner=" + $s.SignerCertificate.Subject)
          Write-Host ("DevTunnelSHA256=" + (Get-FileHash $cli -Algorithm SHA256).Hash)
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'Microsoft') { throw "Microsoft signature failed" }
          & $cli --version
          Invoke-WebRequest -Uri 'https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi' -OutFile $msi
          $s2 = Get-AuthenticodeSignature $msi
          Write-Host ("TightVNCSignature=" + $s2.Status)
          Write-Host ("TightVNCSigner=" + $s2.SignerCertificate.Subject)
          Write-Host ("TightVNCSHA256=" + (Get-FileHash $msi -Algorithm SHA256).Hash)
          if ($s2.Status -ne 'Valid') { throw "TightVNC signature failed" }
          Write-Host "No account login, tunnel, service, or port was created"
