name: Studio runner feasibility
on:
  push:
    branches: [qa/studio-windows-runner-probe]
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Test official Studio installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'RobloxStudioInstaller.exe'
          Invoke-WebRequest -Uri 'https://setup.rbxcdn.com/RobloxStudioInstaller.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          Write-Host ("SignatureStatus=" + $signature.Status)
          Write-Host ("Signer=" + $signature.SignerCertificate.Subject)
          Write-Host ("SHA256=" + (Get-FileHash $installer -Algorithm SHA256).Hash)
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Roblox') { throw "Official signature verification failed" }
          $p = Start-Process $installer -PassThru
          Start-Sleep -Seconds 90
          Get-Process -Name '*Roblox*' -ErrorAction SilentlyContinue | Select-Object ProcessName,Id,SessionId,MainWindowHandle,MainWindowTitle | Format-List
          $files = @(Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Filter RobloxStudioBeta.exe -Recurse -ErrorAction SilentlyContinue)
          Write-Host ("StudioBinaryCount=" + $files.Count)
          $files | ForEach-Object { Write-Host ("StudioVersionFolder=" + $_.Directory.Name) }
          Write-Host "NO_AUTHENTICATION_ATTEMPTED"
