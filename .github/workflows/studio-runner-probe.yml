name: Studio runner feasibility
on:
  push:
    branches: [qa/studio-windows-runner-probe]
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Install official Studio and capture unauthenticated desktop
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'RobloxStudioInstaller.exe'
          Invoke-WebRequest -Uri 'https://setup.rbxcdn.com/RobloxStudioInstaller.exe' -OutFile $installer
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Roblox') { throw "Signature failed" }
          Start-Process $installer
          Start-Sleep -Seconds 180
          Get-Process -Name '*Roblox*' -ErrorAction SilentlyContinue | Select-Object ProcessName,MainWindowHandle,MainWindowTitle | Format-List
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$env:RUNNER_TEMP\studio-unauthenticated.png", [Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
      - name: Retain unauthenticated screen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-unauthenticated-screen
          path: ${{ runner.temp }}/studio-unauthenticated.png
          retention-days: 1
