name: Studio private session
on:
  push:
    branches: [qa/studio-windows-runner-probe]
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Test local-only browser desktop components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'tightvnc.msi'
          Invoke-WebRequest -Uri 'https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi' -OutFile $msi
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'GlavSoft') { throw 'Invalid signature' }
          $testpass = [Guid]::NewGuid().ToString('N').Substring(0,8)
          $args = @('/i', $msi, '/quiet', '/norestart', 'ADDLOCAL=Server', 'SERVER_ADD_FIREWALL_EXCEPTION=0', 'SET_ALLOWLOOPBACK=1', 'VALUE_OF_ALLOWLOOPBACK=1', 'SET_LOOPBACKONLY=1', 'VALUE_OF_LOOPBACKONLY=1', 'SET_ACCEPTHTTPCONNECTIONS=1', 'VALUE_OF_ACCEPTHTTPCONNECTIONS=0', 'SET_USEVNCAUTHENTICATION=1', 'VALUE_OF_USEVNCAUTHENTICATION=1', 'SET_PASSWORD=1', "VALUE_OF_PASSWORD=$testpass")
          $setup = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit $($setup.ExitCode)" }
          Start-Sleep -Seconds 5
          $cfg = Get-ItemProperty 'HKLM:\Software\TightVNC\Server'
          Write-Host ("LoopbackOnly=" + $cfg.LoopbackOnly)
          Write-Host ("VncAuthentication=" + $cfg.UseVncAuthentication)
          if ($cfg.LoopbackOnly -ne 1 -or $cfg.UseVncAuthentication -ne 1) { throw 'Unsafe VNC configuration' }
          $socket = [Net.Sockets.TcpClient]::new()
          $socket.Connect('127.0.0.1',5900)
          $bytes = New-Object byte[] 12
          $count = $socket.GetStream().Read($bytes,0,12)
          $socket.Dispose()
          Write-Host ("LocalVNCBanner=" + [Text.Encoding]::ASCII.GetString($bytes,0,$count).Trim())
          if ($count -ne 12) { throw 'VNC handshake failed' }
          python -m pip install --disable-pip-version-check --quiet websockify==0.13.0
          if ($LASTEXITCODE -ne 0) { throw 'websockify install failed' }
          $zip = Join-Path $env:RUNNER_TEMP 'novnc.zip'
          Invoke-WebRequest -Uri 'https://github.com/novnc/noVNC/archive/a8dfd6a3ea3c74244f5ebdaa5a7f1023007a7820.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/novnc"
          $web = (Get-ChildItem "$env:RUNNER_TEMP/novnc" -Directory | Select-Object -First 1).FullName
          $p = Start-Process python -ArgumentList @('-m','websockify','--web', $web, '127.0.0.1:6080','127.0.0.1:5900') -PassThru
          Start-Sleep -Seconds 5
          $reply = Invoke-WebRequest -Uri 'http://127.0.0.1:6080/vnc.html' -UseBasicParsing
          Write-Host ("NoVNCPageStatus=" + $reply.StatusCode)
          $listener = Get-NetTCPConnection -State Listen -LocalPort 6080
          Write-Host ("WebsockifyBind=" + $listener.LocalAddress)
          if ($listener.LocalAddress -ne '127.0.0.1') { throw 'Unsafe websockify binding' }
          $ws = [Net.WebSockets.ClientWebSocket]::new()
          $ws.Options.AddSubProtocol('binary')
          $ws.ConnectAsync([Uri]'ws://127.0.0.1:6080/',[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          $buf = New-Object byte[] 1024
          $segment = [ArraySegment[byte]]::new($buf)
          $recv = $ws.ReceiveAsync($segment,[Threading.CancellationToken]::None).GetAwaiter().GetResult()
          Write-Host ("WebSocketRFB=" + [Text.Encoding]::ASCII.GetString($buf,0,$recv.Count).Trim())
          $ws.Dispose()
          $src = Join-Path $env:RUNNER_TEMP 'steal-reality-source'
          git clone --quiet --no-checkout https://github.com/mohammedwessam2007/Roblox-.git $src
          if ($LASTEXITCODE -ne 0) { throw 'Repository clone failed' }
          git -C $src checkout --quiet --detach 4c88ab1920f8111ec9b8da812ad1fe09285854f7
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
          $rojoZip = Join-Path $env:RUNNER_TEMP 'rojo.zip'
          Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-windows-x86_64.zip' -OutFile $rojoZip
          if ((Get-FileHash $rojoZip -Algorithm SHA256).Hash -ne 'e1c9a78193c609720f3afb38057d3909ed483ecbf5e9e3541313ba0dcbc4f1f8') { throw 'Rojo archive hash mismatch' }
          Expand-Archive $rojoZip -DestinationPath "$env:RUNNER_TEMP/rojo"
          $rojo = Get-ChildItem "$env:RUNNER_TEMP/rojo" -Filter rojo.exe -Recurse | Select-Object -First 1
          if (!$rojo) { throw 'Rojo executable missing' }
          $place = Join-Path ([Environment]::GetFolderPath('Desktop')) 'StealReality-QA.rbxl'
          & $rojo.FullName build (Join-Path $src 'default.project.json') -o $place
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $place)) { throw 'Place build failed' }
          Write-Host 'GAME_SOURCE=4c88ab1920f8111ec9b8da812ad1fe09285854f7'
          Write-Host ("GAME_SHA256=" + (Get-FileHash $place -Algorithm SHA256).Hash)
          $pub = @'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAhsETW5/T6G7EneMo4nx3
          8fcPg3E3RhEPZmJ7woMIIthzCt1SRSkHeDdzPEJ2/E3v50GZzwkMZGbFiuGUs3U0
          xRwQi0nv4fByxrI+j0PufyaP9rqpuBGJ2njlQRMtiJr5qaOs01mukJM2aojg0JpS
          hkHzP09Kuy3e7DM8TsqnIud7wwjkix+PmDvDBzu8OdTQwToufa22CsUrb9h6bLKR
          N/whmLRriBVg3UrWnjp5cwCQK2ZPOtnlV65CxVnu7YICBuMKL1le9LwFtPV2iilB
          MJ5ETEY8zV2zAdZ0gimj2/RXtZwZFx/Df8Crp28Cumjadcc8Xaxq/D/vJRxQ2oCA
          qQIDAQAB
          -----END PUBLIC KEY-----
          '@
          $rsa = [Security.Cryptography.RSA]::Create()
          $rsa.ImportFromPem($pub)
          function Seal([string]$s) {
            $cipher = $rsa.Encrypt([Text.Encoding]::UTF8.GetBytes($s),[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
            return [Convert]::ToBase64String($cipher)
          }
          $cli = Join-Path $env:RUNNER_TEMP 'devtunnel.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/TunnelsCliDownload/win-x64' -OutFile $cli
          $sig = Get-AuthenticodeSignature $cli
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Invalid Microsoft signature' }
          $out = Join-Path $env:RUNNER_TEMP 'tunnel-login.out'
          $err = Join-Path $env:RUNNER_TEMP 'tunnel-login.err'
          $login = Start-Process $cli -ArgumentList @('user','login','-g','-d') -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $code = $null
          for ($i=0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            $raw = (Get-Content $out,$err -Raw -ErrorAction SilentlyContinue) -join ' '
            if ($raw -match '\b[A-Z0-9]{4}-[A-Z0-9]{4}\b') { $code = $Matches[0]; break }
            $login.Refresh()
            if ($login.HasExited) { break }
          }
          if (!$code) { throw 'No device code received; authentication not started' }
          Write-Host ("ENCRYPTED_DEVICE_CODE=" + (Seal $code))
          Write-Host 'Waiting for owner authorization; no token or plain device code will be logged.'
          $login.WaitForExit(600000) | Out-Null
          $login.Refresh()
          if (!$login.HasExited -or $login.ExitCode -ne 0) { throw 'Device login not completed' }
          $tout = Join-Path $env:RUNNER_TEMP 'tunnel-host.out'
          $terr = Join-Path $env:RUNNER_TEMP 'tunnel-host.err'
          $hostp = Start-Process $cli -ArgumentList @('host','-p','6080') -RedirectStandardOutput $tout -RedirectStandardError $terr -PassThru
          $url = $null
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $raw = (Get-Content $tout,$terr -Raw -ErrorAction SilentlyContinue) -join ' '
            if ($raw -match 'https://[a-zA-Z0-9.-]+\.devtunnels\.ms/?') { $url=$Matches[0]; break }
            $hostp.Refresh()
            if ($hostp.HasExited) { break }
          }
          if (!$url) { throw 'Private tunnel URL not received' }
          Write-Host ("ENCRYPTED_TUNNEL_URL=" + (Seal $url))
          Write-Host ("ENCRYPTED_VNC_PASSWORD=" + (Seal $testpass))
          $installer = Join-Path $env:RUNNER_TEMP 'studio.exe'
          Invoke-WebRequest -Uri 'https://setup.rbxcdn.com/RobloxStudioInstaller.exe' -OutFile $installer
          $sign = Get-AuthenticodeSignature $installer
          if ($sign.Status -ne 'Valid' -or $sign.SignerCertificate.Subject -notmatch 'Roblox') { throw 'Studio signature invalid' }
          Start-Process $installer
          Write-Host 'Studio is starting; tunnel remains private until job ends.'
          Start-Sleep -Seconds 7200

